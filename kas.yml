header:
  version: 14

machine: raspberrypi0-wifi-synth
distro: poky
target: rpi0-synth-image

repos:
  # to repozytorium (zawiera meta-local)
  meta-local:
    layers:
      meta-local:

  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-multimedia:
      meta-networking:
      meta-python:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    branch: scarthgap

local_conf_header:
  license: |
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
  debug: |
    # passwordless root -- development setting, not for a networked device
    EXTRA_IMAGE_FEATURES += "debug-tweaks"
  # By default downloads and sstate cache live in build/downloads and
  # build/sstate-cache. To share them between build directories, uncomment:
  # cache: |
  #   DL_DIR = "/path/to/downloads"
  #   SSTATE_DIR = "/path/to/sstate-cache"
